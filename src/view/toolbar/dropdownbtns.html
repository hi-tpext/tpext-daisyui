<div id="{$id}-div" class="dropdown {$dropdownDir} dropdown-end {$groupClass}" role="group" {$groupAttr|raw}>
        <a class="btn {$class} dropdown-toggle" id="{$id}" tabindex="0" role="button" {$attr|raw}>
                {if condition="$icon"}<i class="mdi {$icon}"></i>{/if}{$label|raw}
                <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 inline-block ml-1" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7" /></svg>
        </a>
        <ul class="dropdown-content z-[1] menu shadow bg-base-100 rounded-box w-52">
                {volist name="items" id="item"}
                <li>
                        <a data-key="{$item.key}" class="{$item.class}" data-url="{$item.url}" href="javascript:;" tabindex="0" {$item.attr|raw}>{if condition="$item.icon"}<i class="mdi {$item.icon}"></i>{/if}{$item.label|raw}</a>
                </li>
                {/volist}
        </ul>
</div>
