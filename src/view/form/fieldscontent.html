{volist name="rows" id="row"}
{if condition="$hasWrapper"}
<div class="field-row grid grid-cols-12 gap-x-4 gap-y-1 {$row->getColSizeClass()} {$row->getClass()} row-{$row->getName()}-div {$row->getErrorClass()}"
    {$row->getAttrWithStyle()|raw}>
    {:$row->render()}
</div>
{else/}
{:$row->render()}
{/if}
{/volist}
