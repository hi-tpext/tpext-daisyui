<!--
  Tailwind JIT safelist — 冗余文件，不会被用户访问。
  用途：Tailwind 3 对 DaisyUI 4 通过 addComponents 注入的 postcss-js Object 格式
  无法正确解析 selector token，导致 checkbox/radio 等基础组件被 purge。
  这里把所有需要的 DaisyUI class 写成字面量，确保 Tailwind 扫描到。

  更新规则：
  1. 模板 (.html) 或 PHP 字符串里直接写的 DaisyUI class — 加这里
  2. PHP 运行时动态拼接的 class (如 col-span-N) — 仍走 tailwind.config.js safelist
  3. 新增 displayer/组件时，把用到的 DaisyUI class 追加到下面
-->

<!-- ========== 表单控件 ========== -->
<input type="checkbox" class="checkbox checkbox-sm checkbox-primary">
  <input type="radio" class="radio radio-sm radio-primary">
  <input type="checkbox" class="toggle toggle-sm toggle-primary">
  <input class="input input-bordered input-sm">
  <input class="file file-url-input">
  <select class="select select-bordered select-sm"></select>
  <textarea class="textarea textarea-bordered textarea-sm"></textarea>
  <div class="rating"></div>
  <input type="range" class="range range-primary">

<!-- ========== 按钮 ========== -->
<!-- 全部颜色变体写全：DaisyUI 4 会按使用情况裁剪组件类，而 Tailwind 不扫描 myadmin8
     应用代码，应用里单独用到的 btn-neutral/btn-accent 等若不在此列出会被 purge -->
<button class="btn btn-xs btn-sm btn-lg btn-block btn-wide btn-circle btn-square btn-active btn-disabled btn-outline btn-ghost btn-link btn-primary btn-secondary btn-accent btn-info btn-success btn-warning btn-error btn-neutral">btn</button>

<!-- ========== 标签/徽章 ========== -->
<label class="label"></label>
<span class="badge"></span>
<span class="badge badge-sm badge-lg badge-primary badge-secondary badge-accent badge-info badge-success badge-warning badge-error"></span>

<!-- ========== 表格 ========== -->
<table class="table table-sm table-zebra table-hover table-bordered"></table>

<!-- ========== 通知/反馈 ========== -->
<div class="alert alert-info alert-success alert-warning alert-error"></div>
<div class="toast toast-start toast-end toast-top toast-middle toast-bottom"></div>
<div class="progress progress-primary progress-secondary progress-accent progress-info progress-success progress-warning progress-error"></div>
<div class="loading loading-spinner loading-dots loading-ring loading-ball loading-bars loading-infinity"></div>

<!-- ========== 布局组件 ========== -->
<div class="card card-compact card-normal"></div>
<div class="divider"></div>
<div class="stack"></div>
<div class="join join-horizontal join-vertical">
  <button class="join-item btn"></button>
  <input class="join-item input">
  <select class="join-item select"></select>
  <label class="join-item"></label>
</div>

<!-- ========== 导航 ========== -->

<div class="tabs tabs-bordered tabs-lifted tabs-boxed"></div>

<!-- ========== 图标 ========== -->

<!-- ========== 其他 DaisyUI 变量/状态相关 ========== -->
