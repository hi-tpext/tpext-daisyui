{:$tablink->render()}
{/notempty}
{notempty name="addTop"}
{:$addTop->render()}
{/notempty}
<div id="{$id}" class="form-wrapper">
    <form action="{$action}" method="{$method|default='POST'}" enctype="application/x-www-form-urlencoded"
        class="grid grid-cols-12 gap-x-4 gap-y-2 mb-2 {$class}" {$attr|raw}>
        {volist name="rows" id="row"}
        <div class="field-row grid grid-cols-12 gap-x-4 gap-y-1 {$row->getColSizeClass()} {$row->getClass()} row-{$row->getClassName()}-div
            {$row->getErrorClass()}" {$row->getAttrWithStyle()|raw}>
            {:$row->render()}
        </div>
        {/volist}
    </form>
    <script>
        if (!window.__forms__) { window.__forms__ = []; }

        window.__forms__['{$id}'] = {
            ajax: '{$ajax}' == '1',
            searchFor: '{$searchFor}',
            export: 0,
            action: '{$action}',
            formSubmit: function () {
                tpb.loading('hide');
                var that = this;
                if (!that.export && that.ajax) {
                    tpb.loading('show');

                    var formEl = document.querySelector('#{$id} form');
                    // 表单默认 method=GET（Search.php $method='get'），必须按实际 method 发送：
                    // 后端分页等参数只从 get 读取（Table.php input('get.__page__')），写死 post 会导致翻页永远停在第 1 页
                    var method = ((formEl && formEl.getAttribute('method')) || 'POST').toUpperCase();
                    var url = that.action || location.href;

                    var request;
                    if (method === 'POST') {
                        request = axios.post(url, new FormData(formEl));
                    } else {
                        var qs = new URLSearchParams();
                        new FormData(formEl).forEach(function (v, k) { qs.append(k, v); });
                        url += (url.indexOf('?') >= 0 ? '&' : '?') + qs.toString();
                        request = axios.get(url);
                    }

                    request
                        .then(function (response) {
                            tpb.loading('hide');
                            var data = response.data;
                            var target = document.getElementById(that.searchFor);
                            if (!target || typeof data !== 'string') return;

                            // 6.453 骨架/数据分离换表：旧整容器 outerHTML 替换把 thead
                            // 连同列宽/拖拽手柄/滚动位置一起扔掉（列位置每页漂移 + 横向
                            // 滚动复位的根源）。改为只移植「数据层」——tbody、空态、
                            // 分页条，并重执行片段脚本；.table-wrap/thead/列宽/手柄/
                            // 冻结表头原样存活，水平/垂直滚动位置天然保持，无需保存恢复
                            var doc = new DOMParser().parseFromString(data, 'text/html');
                            var fresh = doc.getElementById(that.searchFor);
                            if (!fresh) { target.outerHTML = data; return; } // 结构异常兜底：退回整替换

                            // 1) tbody（列表数据本体）
                            // 6.460 不再直接换入：新行里的 x-select 等宿主带着原生
                            // 控件（select 宽度=最长 option）直接参与可见布局，组件
                            // 建好后（TomSelect 收缩到选中项宽度）列宽再跳一版——刷新
                            // /筛选时整表抖动。改为 stagedSwapTbody 离屏暂存构建，
                            // 建好后原子换入；片段脚本与选中态同步必须等换入后执行
                            //（initTableFreeze 量冻结偏移、initTreeLines 画参考线都
                            // 依赖新行已在真表里），故挂到 done 回调
                            var freshTbody = fresh.querySelector('.table-wrap tbody');
                            var liveTable = target.querySelector('.table-wrap table');
                            var liveTbody = liveTable ? liveTable.tBodies[0] : null;

                            // 2) 空态提示（fresh 有/无 ↔ live 无/有 四种组合都对齐）
                            var freshEmpty = fresh.querySelector('.items-empty-text');
                            var liveEmpty = target.querySelector('.items-empty-text');
                            if (freshEmpty && liveEmpty) {
                                liveEmpty.parentNode.replaceChild(document.importNode(freshEmpty, true), liveEmpty);
                            } else if (freshEmpty) {
                                // 6.468 兜底插入必须落在 .table-wrap 之外（模板原生位置
                                // 就是 wrap 之后）——liveTable.parentNode 是 wrap 内部，
                                // freeze 限高后空态提示会随表格内容滚动/被裁剪
                                var emptyHost = liveTable ? liveTable.closest('.table-wrap') : null;
                                if (emptyHost) emptyHost.insertAdjacentElement('afterend', document.importNode(freshEmpty, true));
                                else target.appendChild(document.importNode(freshEmpty, true));
                            } else if (liveEmpty) {
                                liveEmpty.parentNode.removeChild(liveEmpty);
                            }

                            // 3) 分页条（含 summary/pagesize 下拉；fresh 缺席=单页，移除旧条）
                            var freshBar = fresh.querySelector('.pagination-bar');
                            var liveBar = target.querySelector('.pagination-bar');
                            if (freshBar && liveBar) {
                                liveBar.parentNode.replaceChild(document.importNode(freshBar, true), liveBar);
                            } else if (freshBar) {
                                // 6.468 同空态提示：插到 wrap 之外。首帧空表格（无 live
                                // 分页条可换）时旧代码 appendChild 进 wrap，freeze 限高
                                // 内滚后分页条随滚动条上下移动（operationlog 首帧空表 +
                                // AJAX 填充场景实测复现；admin 直出有数据的页面走不到此分支故无感）
                                var barHost = liveTable ? liveTable.closest('.table-wrap') : null;
                                if (barHost) barHost.insertAdjacentElement('afterend', document.importNode(freshBar, true));
                                else target.appendChild(document.importNode(freshBar, true));
                            } else if (liveBar) {
                                liveBar.parentNode.removeChild(liveBar);
                            }

                            // 4+5) 换入完成后的收尾：重执行片段脚本 + 行选中态对齐。
                            // 片段脚本（页码 hidden input 回写、renderFiles、
                            // initTableFreeze——冻结偏移按新 tbody 重算、initTreeLines）
                            // 内联 script append 即同步执行，随后摘除防跨页堆积；
                            // 存活 thead 上的列宽/手柄经 initTableFreeze 的幂等路径自愈
                            var afterSwap = function () {
                                // 6.466 行选择框的 check-{id} 类按渲染时间生成，每次响应
                                // 都是全新类名；6.453 换表后 thead 存活，master 的
                                // data-check 还挂着上一轮的旧类 → 子项选择器落空，全选/
                                // 批量选择全失效（旧整容器替换时 thead 一起换新不暴露）。
                                // 从 fresh thead 同步，且必须在片段脚本前——脚本里的
                                // 初始态同步同样活读这个属性
                                var freshMaster = fresh.querySelector('thead input.checkall');
                                var liveMaster = target.querySelector('input.checkall');
                                if (freshMaster && liveMaster) {
                                    var freshCls = freshMaster.getAttribute('data-check');
                                    if (freshCls && freshCls !== liveMaster.getAttribute('data-check')) {
                                        liveMaster.setAttribute('data-check', freshCls);
                                    }
                                }

                                fresh.querySelectorAll('script').forEach(function (old) {
                                    var s = document.createElement('script');
                                    s.textContent = old.textContent;
                                    target.appendChild(s);
                                    s.parentNode.removeChild(s);
                                });

                                // 行选中样式/checkall 与新数据对齐（委托逻辑只在首绑时同步过初始态）
                                var checkall = target.querySelector('input.checkall');
                                var cls = checkall ? checkall.getAttribute('data-check') : null;
                                var cbs = cls ? target.querySelectorAll('.table-wrap .' + cls) : [];
                                var total = cbs.length, checked = 0;
                                cbs.forEach(function (cb) {
                                    var tr = cb.closest('tr');
                                    if (tr) tr.classList.toggle('active', cb.checked);
                                    if (cb.checked) checked++;
                                });
                                if (checkall) checkall.checked = total > 0 && checked === total;

                                // 表格刷新后行选中态归零，同步批量按钮禁用态（工具栏在刷新片段之外，需手动重算）
                                if (window.tpextbuilder && window.tpextbuilder.updateBatchBtnState) window.tpextbuilder.updateBatchBtnState();
                            };

                            if (freshTbody && liveTbody && window.tpextbuilder && window.tpextbuilder.stagedSwapTbody) {
                                window.tpextbuilder.stagedSwapTbody(target, liveTbody, document.importNode(freshTbody, true), afterSwap);
                            } else {
                                // 旧路径兜底（tpextbuilder.js 缺位等）：直接换入
                                if (freshTbody && liveTbody) {
                                    liveTbody.parentNode.replaceChild(document.importNode(freshTbody, true), liveTbody);
                                }
                                afterSwap();
                            }
                        })
                        .catch(function () {
                            tpb.loading('hide');
                            // 6.257 网络错误提示由 tpb 全局 axios 拦截器统一出口，勿在此重复 notify
                        });

                    return false;
                }
                return true;
            },
            exportPost: function (url, file_type, ajax) {
                // 6.255 两步导出：AJAX 请求后端生成文件（Export.php 的 isAjax 分支把文件
                // 写入 runtime/export/ 后返回 json{code:1,msg,data:下载地址}），成功后弹
                // downloadBox，用户点「下载」链接才真正取文件。
                // 第 3 参 ajax 保留旧签名兼容；当前 AJAX 即唯一主路径。
                var that = this;
                that.export = 1;
                var form = document.querySelector('#{$id} form');

                var values = [];
                document.querySelectorAll("#{$searchFor} input.table-row-checkbox:checked").forEach(function (e) {
                    values.push(e.value);
                });

                if (window.axios && form) {
                    // export() 只从 GET 袋取参（input('get.__ids__') 等），与 formSubmit GET 分支同款组 query
                    var qs = new URLSearchParams();
                    new FormData(form).forEach(function (v, k) { qs.append(k, v); });
                    qs.set('__file_type__', file_type || '');
                    qs.set('__ids__', values.join(','));
                    tpb.loading('show');
                    axios.get(url + (url.indexOf('?') >= 0 ? '&' : '?') + qs.toString())
                        .then(function (response) {
                            tpb.loading('hide');
                            that.export = 0;
                            var data = response.data || {};
                            if (1 == data.code && data.data) {
                                // data 形如 .../export?path=20260914/标题-Timestamp-001.csv → 取 basename 展示
                                var path = String(data.data).split(/[?&]path=/)[1] || '';
                                var name = path.split('#')[0];
                                try { name = decodeURIComponent(name); } catch (e) {}
                                name = name.replace(/^.*[\/\\]/, '');
                                if (window.tpb && window.tpb.downloadBox) {
                                    window.tpb.downloadBox(data.msg, data.data, name);
                                } else {
                                    location.href = data.data; // tpb.js 缺位兜底：直接触发下载
                                }
                            } else {
                                tpb.notify(data.msg || "{:__blang('builder_network_error')}", 'danger');
                            }
                        })
                        .catch(function () {
                            tpb.loading('hide');
                            that.export = 0;
                            // 6.257 通知交给全局 axios 拦截器，勿重复 notify
                        });
                    return;
                }

                // axios/表单缺位兜底：保持旧 form.submit 直下（后端非 AJAX 分支流式吐附件）
                var __file_type__ = document.createElement("input");
                __file_type__.type = "hidden";
                __file_type__.name = '__file_type__';
                __file_type__.value = file_type || '';
                form.appendChild(__file_type__);

                var __ids__ = document.createElement("input");
                __ids__.type = "hidden";
                __ids__.name = '__ids__';
                __ids__.value = values.join(',');
                form.appendChild(__ids__);

                tpb.loading('show');
                form.action = url;
                form.submit();
                setTimeout(function () { tpb.loading('hide'); }, 2000);

                __ids__.remove();
                __file_type__.remove();
                this.export = 0;
            }
        };
    </script>
</div>
{notempty name="addBottom"}
{:$addBottom->render()}
{/notempty}
